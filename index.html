<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>청소당번 랜덤 추첨</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans KR", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
      font-size: 32px;
      color: #333;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .input-section {
      background: #f7f8fc;
      border-radius: 16px;
      padding: 20px;
    }

    .input-section h2 {
      margin-top: 0;
      font-size: 20px;
    }

    textarea {
      width: 100%;
      height: 220px;
      resize: vertical;
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      line-height: 1.8;
      outline: none;
      transition: 0.2s;
    }

    textarea:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
    }

    .count {
      margin-top: 10px;
      color: #666;
      font-size: 14px;
      text-align: right;
    }

    .count strong {
      color: #667eea;
    }

    .button-area {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .draw-btn {
      flex: 1;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 18px;
    }

    .reset-btn {
      background: #eee;
      color: #555;
    }

    .result-section {
      margin-top: 30px;
    }

    .result-title {
      text-align: center;
      font-size: 22px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .result-title span {
      color: #667eea;
    }

    .result {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .person {
      min-height: 90px;
      border-radius: 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      animation: pop 0.5s ease forwards;
      opacity: 0;
      transform: scale(0.5);
    }

    .person:nth-child(1) {
      animation-delay: 0.1s;
    }

    .person:nth-child(2) {
      animation-delay: 0.2s;
    }

    .person:nth-child(3) {
      animation-delay: 0.3s;
    }

    .person:nth-child(4) {
      animation-delay: 0.4s;
    }

    .person:nth-child(5) {
      animation-delay: 0.5s;
    }

    @keyframes pop {
      0% {
        opacity: 0;
        transform: scale(0.5) rotate(-10deg);
      }

      70% {
        transform: scale(1.1) rotate(3deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #aaa;
      padding: 40px 0;
      background: #f7f8fc;
      border-radius: 16px;
    }

    .notice {
      margin-top: 15px;
      text-align: center;
      color: #e74c3c;
      font-size: 14px;
      min-height: 20px;
    }

    .drawing {
      animation: shake 0.1s infinite;
    }

    @keyframes shake {
      0% {
        transform: translateX(-3px);
      }

      50% {
        transform: translateX(3px);
      }

      100% {
        transform: translateX(-3px);
      }
    }

    @media (max-width: 700px) {
      .container {
        padding: 20px;
        border-radius: 18px;
      }

      h1 {
        font-size: 26px;
      }

      .result {
        grid-template-columns: repeat(2, 1fr);
      }

      .person:last-child {
        grid-column: 1 / -1;
      }

      .button-area {
        flex-direction: column;
      }

      .reset-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🧹 청소당번 추첨기</h1>
    <div class="subtitle">
      30명 중에서 청소당번 5명을 랜덤으로 뽑습니다.
    </div>

    <div class="input-section">
      <h2>👥 학생 이름 입력</h2>

      <textarea
        id="names"
        placeholder="이름을 한 줄에 한 명씩 입력하세요.

예시:
김민준
이서연
박지훈
최유진
정도윤
..."
      ></textarea>

      <div class="count">
        현재 <strong id="count">0</strong>명 입력됨
      </div>

      <div class="button-area">
        <button class="draw-btn" onclick="drawPeople()">
          🎲 5명 추첨하기
        </button>

        <button class="reset-btn" onclick="resetAll()">
          초기화
        </button>
      </div>

      <div class="notice" id="notice"></div>
    </div>

    <div class="result-section">

      <div class="result-title">
        🏆 오늘의 청소당번 <span>5명</span>
      </div>

      <div class="result" id="result">
        <div class="empty">
          추첨 버튼을 눌러 청소당번을 뽑아주세요!
        </div>
      </div>

    </div>

  </div>


  <script>
    const textarea = document.getElementById("names");
    const count = document.getElementById("count");
    const result = document.getElementById("result");
    const notice = document.getElementById("notice");

    // 이름 개수 표시
    textarea.addEventListener("input", updateCount);

    function getNames() {
      return textarea.value
        .split("\n")
        .map(name => name.trim())
        .filter(name => name !== "");
    }

    function updateCount() {
      const names = getNames();
      count.textContent = names.length;

      if (names.length === 30) {
        count.style.color = "#27ae60";
      } else {
        count.style.color = "#667eea";
      }
    }

    // 5명 랜덤 추첨
    function drawPeople() {
      const names = getNames();

      notice.textContent = "";

      if (names.length < 5) {
        notice.textContent = "⚠️ 최소 5명의 이름을 입력해주세요.";
        return;
      }

      // 같은 이름이 여러 번 입력되었는지 확인
      const uniqueNames = [...new Set(names)];

      if (uniqueNames.length < 5) {
        notice.textContent = "⚠️ 서로 다른 이름을 최소 5명 입력해주세요.";
        return;
      }

      // 30명을 권장하지만 5명 이상이면 추첨 가능
      if (names.length !== 30) {
        notice.textContent =
          `현재 ${names.length}명입니다. 30명이 아니어도 추첨은 가능합니다.`;
      }

      // 버튼 효과
      const drawButton = document.querySelector(".draw-btn");
      drawButton.disabled = true;
      drawButton.classList.add("drawing");
      drawButton.textContent = "🎲 추첨 중...";

      // 결과 초기화
      result.innerHTML = `
        <div class="empty drawing">
          🎲
          <br>
          행운의 주인공을 뽑는 중...
        </div>
      `;

      // 1.5초 후 결과 표시
      setTimeout(() => {

        // 이름 배열 복사
        const shuffled = [...uniqueNames];

        // Fisher-Yates 셔플
        for (let i = shuffled.length - 1; i > 0; i--) {
          const randomIndex = Math.floor(Math.random() * (i + 1));

          [shuffled[i], shuffled[randomIndex]] =
            [shuffled[randomIndex], shuffled[i]];
        }

        // 앞에서 5명 선택
        const selected = shuffled.slice(0, 5);

        // 결과 표시
        result.innerHTML = "";

        selected.forEach((name, index) => {
          const person = document.createElement("div");
          person.className = "person";
          person.textContent = name;

          result.appendChild(person);
        });

        drawButton.disabled = false;
        drawButton.classList.remove("drawing");
        drawButton.textContent = "🎲 다시 5명 추첨하기";

      }, 1500);
    }

    // 전체 초기화
    function resetAll() {
      textarea.value = "";
      count.textContent = "0";
      notice.textContent = "";

      result.innerHTML = `
        <div class="empty">
          추첨 버튼을 눌러 청소당번을 뽑아주세요!
        </div>
      `;

      textarea.focus();
    }

    // 예시 30명 자동 입력
    // 필요 없으면 이 부분을 삭제해도 됩니다.
    const exampleNames = [
      "김민준",
      "이서연",
      "박지훈",
      "최유진",
      "정도윤",
      "강민서",
      "조현우",
      "윤지우",
      "장서준",
      "임수빈",
      "한지민",
      "오준혁",
      "서예은",
      "신도윤",
      "권하은",
      "황지호",
      "안서윤",
      "송민재",
      "류지안",
      "문건우",
      "배수아",
      "백현준",
      "노유나",
      "전지훈",
      "홍서연",
      "고민재",
      "양서진",
      "유현우",
      "남지민",
      "김도현"
    ];

    // 처음 실행할 때 예시 이름 자동 표시
    textarea.value = exampleNames.join("\n");
    updateCount();
  </script>

</body>
</html>
